<html>
    <head>
        <title>Simple-Pendulum</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        
        <h1 style="color:blue; text-align:center;padding-top: 40px;"><b>Simple Pendulum-Physics</b></h1> 
        <h2 style="color:wheat;text-align: center;">Default Gravity of Earth(g) : 9.8</h2>
        <br>
        <br>

        <div class="box">
            <div class="control">

                <h2><span id="formula" >Time period(T) = 2π√(L/g)  </span> </h2>
          
                <div class="text">
                    <label for="length">Pendulum Length</label>
                    <input 
                    type="range"
                    id="length"
                    min="0.5"
                    max="2"
                    step="0.1"
                    value="1"
                    >
                    <span id="lengthValue">1m</span>
                </div>
                <p id="period">Time Period: 0s</p>
                <button id="pauseButton">Pause</button>
            </div>


            <div class="animation">
                <div class="pendulum">
                    <div class="string"></div>
                    <div class="bob"></div>
                </div>
            </div>


        </div>
        
        <script src="script.js"></script>
    </body>
</html>
